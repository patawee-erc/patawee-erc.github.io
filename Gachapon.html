<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Gachapon Lucky Draw</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg1: #fff1f3;
            --bg2: #e6f4ff;
            --bg3: #fff6e0;
            --ink: #2d3436;
            --mute: #7b8794;
            --glass: rgba(255, 255, 255, .55);
            --glass-b: rgba(255, 255, 255, .8);
            --card: rgba(255, 255, 255, .96);
            --red: #ff5a5f;
            --red2: #c9283a;
            --blue: #34ace0;
            --gold: #ffc83d;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg1: #2a1530;
                --bg2: #10213f;
                --bg3: #2f2314;
                --ink: #f1f2f6;
                --mute: #a4b0be;
                --glass: rgba(30, 30, 50, .55);
                --glass-b: rgba(255, 255, 255, .18);
                --card: rgba(30, 32, 52, .97);
            }
        }
        :root[data-theme="dark"] {
            --bg1: #2a1530;
            --bg2: #10213f;
            --bg3: #2f2314;
            --ink: #f1f2f6;
            --mute: #a4b0be;
            --glass: rgba(30, 30, 50, .55);
            --glass-b: rgba(255, 255, 255, .18);
            --card: rgba(30, 32, 52, .97);
        }
        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
            height: 100%
        }
        * {
            box-sizing: border-box
        }
        body {
            margin: 0;
            height: 100%;
            font-family: 'Kanit', system-ui, sans-serif;
            color: var(--ink);
            overflow: hidden;
            user-select: none;
            background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
            background-size: 300% 300%;
            animation: bg 18s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center
        }
        @keyframes bg {
            0%,
            100% {
                background-position: 0 50%
            }
            50% {
                background-position: 100% 50%
            }
        }
        .bokeh {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden
        }
        .bokeh i {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, .7), rgba(255, 255, 255, 0) 70%);
            animation: float linear infinite
        }
        @keyframes float {
            from {
                transform: translateY(105vh) scale(.6)
            }
            to {
                transform: translateY(-20vh) scale(1.2)
            }
        }
        #confetti {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 900
        }
        
        .badge {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top, 0px));
            left: 16px;
            z-index: 100;
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-b);
            padding: 8px 22px;
            border-radius: 50px;
            font-weight: 500;
            color: var(--mute);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .08)
        }
        .badge b {
            color: var(--red);
            font-size: 1.6rem;
            font-weight: 900;
            margin: 0 4px;
            display: inline-block
        }
        .badge b.pop {
            animation: pop .4s
        }
        @keyframes pop {
            50% {
                transform: scale(1.5)
            }
        }
        .panel {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top, 0px));
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100
        }
        .cbtn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 1px solid var(--glass-b);
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: var(--ink);
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .1);
            transition: .25s cubic-bezier(.34, 1.56, .64, 1);
            display: grid;
            place-items: center;
            font-family: inherit
        }
        .cbtn:hover {
            transform: scale(1.15) translateY(-3px);
            color: var(--red)
        }
        .hint {
            position: fixed;
            bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            left: 0;
            right: 0;
            text-align: center;
            color: var(--mute);
            font-size: .85rem;
            z-index: 5;
            pointer-events: none
        }
        
        .logw {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            z-index: 150;
            transition: transform .6s cubic-bezier(.34, 1.56, .64, 1)
        }
        .logw.col {
            transform: translateY(-50%) translateX(-270px)
        }
        .logc {
            width: 270px;
            max-height: min(520px, 75vh);
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-b);
            border-left: 0;
            border-radius: 0 28px 28px 0;
            padding: 18px;
            display: flex;
            flex-direction: column;
            box-shadow: 12px 12px 35px rgba(0, 0, 0, .1)
        }
        .logc h3 {
            margin: 0 0 12px;
            font-weight: 900;
            color: var(--red);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.15rem;
            border-bottom: 2px dashed rgba(255, 90, 95, .35);
            padding-bottom: 10px
        }
        .logc h3 span {
            margin-left: auto;
            display: flex;
            gap: 4px
        }
        .mini {
            border: 0;
            background: rgba(255, 90, 95, .15);
            color: var(--red);
            border-radius: 10px;
            padding: 3px 8px;
            cursor: pointer;
            font: 500 .75rem 'Kanit'
        }
        .mini:hover {
            background: var(--red);
            color: #fff
        }
        #logList {
            list-style: none;
            margin: 0;
            padding: 0 4px 0 0;
            overflow-y: auto;
            flex: 1
        }
        #logList::-webkit-scrollbar {
            width: 5px
        }
        #logList::-webkit-scrollbar-thumb {
            background: var(--red);
            border-radius: 9px
        }
        .li {
            background: var(--card);
            margin-bottom: 8px;
            padding: 9px 12px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, .05);
            animation: sl .5s cubic-bezier(.34, 1.56, .64, 1)
        }
        @keyframes sl {
            from {
                opacity: 0;
                transform: translateX(-30px)
            }
        }
        .li em {
            font-style: normal;
            font-weight: 900;
            color: var(--mute);
            min-width: 26px;
            font-size: .85rem
        }
        .li i {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 10px;
            flex: none;
            border: 2px solid #fff;
            box-shadow: inset -2px -2px 4px rgba(0, 0, 0, .3)
        }
        .li span {
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }
        .empty {
            color: var(--mute);
            text-align: center;
            padding: 20px 0;
            font-size: .9rem
        }
        .tog {
            width: 40px;
            height: 100px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-b);
            border-left: 0;
            border-radius: 0 18px 18px 0;
            color: var(--red);
            cursor: pointer;
            font-size: 1.2rem;
            margin-left: -1px
        }
        
        #stage {
            position: relative;
            width: 440px;
            height: 690px;
            flex: none;
            transform-origin: center center
        }
        .shk {
            animation: mshake .55s ease-in-out
        }
        @keyframes mshake {
            0%,
            100% {
                transform: translate(0)
            }
            20% {
                transform: translate(-6px, 3px) rotate(-1deg)
            }
            40% {
                transform: translate(6px, -3px) rotate(1deg)
            }
            60% {
                transform: translate(-5px, -3px) rotate(-1deg)
            }
            80% {
                transform: translate(5px, 3px) rotate(1deg)
            }
        }
        .glow {
            position: absolute;
            left: 50%;
            top: 40%;
            width: 520px;
            height: 520px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 61, .45), transparent 65%);
            opacity: 0;
            transition: .5s;
            pointer-events: none
        }
        .busy .glow {
            opacity: 1;
            animation: gl 1s infinite alternate
        }
        @keyframes gl {
            to {
                transform: translate(-50%, -50%) scale(1.15)
            }
        }
        .dome {
            position: absolute;
            left: 20px;
            top: 0;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            z-index: 3;
            cursor: pointer;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .05) 55%, rgba(255, 255, 255, .35) 100%);
            border: 7px solid rgba(255, 255, 255, .85);
            box-shadow: inset -22px -22px 60px rgba(0, 0, 0, .12), inset 22px 22px 60px rgba(255, 255, 255, .7), 0 28px 50px rgba(0, 0, 0, .2);
            overflow: hidden
        }
        .dome canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%
        }
        .dome::after {
            content: "";
            position: absolute;
            top: 6%;
            left: 11%;
            width: 150px;
            height: 90px;
            border-radius: 50%;
            transform: rotate(-30deg);
            background: linear-gradient(rgba(255, 255, 255, .85), rgba(255, 255, 255, 0));
            pointer-events: none
        }
        .dome::before {
            content: "";
            position: absolute;
            bottom: 8%;
            right: 12%;
            width: 60px;
            height: 24px;
            border-radius: 50%;
            transform: rotate(-30deg);
            background: rgba(255, 255, 255, .35);
            z-index: 2;
            pointer-events: none
        }
        .ring {
            position: absolute;
            left: 10px;
            top: 372px;
            width: 420px;
            height: 46px;
            border-radius: 50%;
            z-index: 4;
            background: linear-gradient(#ffe08a, #e0a21a 60%, #a8710b);
            box-shadow: 0 6px 12px rgba(0, 0, 0, .35), inset 0 2px 3px rgba(255, 255, 255, .7)
        }
        .base {
            position: absolute;
            left: 0;
            top: 390px;
            width: 440px;
            height: 290px;
            z-index: 2;
            border-radius: 24px 24px 70px 70px;
            background: linear-gradient(160deg, #ff7a7f, var(--red) 40%, var(--red2));
            box-shadow: inset 0 10px 20px rgba(255, 255, 255, .25), inset 0 -14px 24px rgba(0, 0, 0, .3), 0 30px 50px rgba(0, 0, 0, .35);
            border: 2px solid rgba(255, 255, 255, .25)
        }
        .base::before {
            content: "";
            position: absolute;
            inset: 8px 12px auto 12px;
            height: 40%;
            border-radius: 20px 20px 60px 60px;
            background: linear-gradient(rgba(255, 255, 255, .28), transparent)
        }
        .plate {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(#fff, #eceff3);
            color: var(--red2);
            padding: 6px 34px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 1.6rem;
            letter-spacing: 4px;
            box-shadow: inset 0 2px 4px #fff, 0 5px 12px rgba(0, 0, 0, .35);
            border: 1px solid #ddd
        }
        .lights {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px
        }
        .lights i {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffe08a;
            box-shadow: 0 0 8px #ffd34d;
            animation: bl 1.2s infinite
        }
        .lights i:nth-child(even) {
            animation-delay: .6s
        }
        .busy .lights i {
            animation-duration: .2s
        }
        @keyframes bl {
            50% {
                opacity: .25;
                box-shadow: none
            }
        }
        .knoba {
            position: absolute;
            top: 105px;
            left: 50%;
            margin-left: -62px;
            width: 124px;
            height: 124px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff, #dfe4ea);
            border: 5px solid #eceff3;
            box-shadow: inset 0 5px 10px rgba(0, 0, 0, .12), 0 10px 20px rgba(0, 0, 0, .35);
            display: grid;
            place-items: center;
            cursor: pointer;
            z-index: 5;
            transition: transform .2s
        }
        .knoba:hover {
            transform: scale(1.05)
        }
        .knoba:active {
            transform: scale(.96)
        }
        .knob {
            width: 90px;
            height: 26px;
            border-radius: 14px;
            background: linear-gradient(#f1f2f6, #7f8fa6);
            box-shadow: 0 5px 8px rgba(0, 0, 0, .35);
            position: relative
        }
        .knob::after {
            content: "";
            position: absolute;
            left: 30px;
            top: -30px;
            width: 28px;
            height: 86px;
            border-radius: 14px;
            background: linear-gradient(90deg, #f1f2f6, #7f8fa6);
            box-shadow: 5px 0 8px rgba(0, 0, 0, .25)
        }
        .knob.spin {
            animation: rk 1s cubic-bezier(.25, 1, .5, 1)
        }
        @keyframes rk {
            to {
                transform: rotate(360deg)
            }
        }
        .chute {
            position: absolute;
            bottom: 26px;
            left: 50%;
            margin-left: -95px;
            width: 190px;
            height: 88px;
            border-radius: 18px 18px 46px 46px;
            background: #1b2229;
            border: 6px solid #4b5866;
            box-shadow: inset 0 18px 28px #000;
            overflow: hidden
        }
        .rball {
            position: absolute;
            left: 50%;
            top: -110px;
            width: 68px;
            height: 68px;
            margin-left: -34px;
            border-radius: 50%;
            opacity: 0
        }
        .rball.drop {
            animation: drop .9s cubic-bezier(.4, 0, .6, 1) forwards
        }
        @keyframes drop {
            0% {
                top: -110px;
                opacity: 1
            }
            60% {
                top: 14px;
                opacity: 1
            }
            75% {
                top: -6px
            }
            90% {
                top: 14px
            }
            100% {
                top: 14px;
                opacity: 1
            }
        }
        
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 25, .5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: .35s
        }
        .modal.on {
            opacity: 1;
            pointer-events: all
        }
        .mc {
            background: var(--card);
            padding: 28px;
            border-radius: 28px;
            width: 92%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
            transform: translateY(40px) scale(.95);
            transition: .45s cubic-bezier(.34, 1.56, .64, 1)
        }
        .modal.on .mc {
            transform: none
        }
        .mc h2 {
            margin: 0;
            color: var(--red);
            font-weight: 900
        }
        textarea {
            width: 100%;
            height: 210px;
            padding: 16px;
            border: 2px solid rgba(128, 140, 160, .35);
            border-radius: 16px;
            font: 400 1.1rem 'Kanit';
            margin: 14px 0;
            outline: 0;
            background: transparent;
            color: var(--ink);
            resize: none;
            user-select: text
        }
        textarea:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(52, 172, 224, .2)
        }
        .opt {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
            color: var(--mute);
            cursor: pointer
        }
        .opt input {
            width: 20px;
            height: 20px;
            accent-color: var(--red)
        }
        .bp {
            background: linear-gradient(135deg, var(--red), var(--red2));
            color: #fff;
            border: 0;
            padding: 12px 44px;
            border-radius: 50px;
            font: 700 1.2rem 'Kanit';
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 90, 95, .35);
            transition: .2s
        }
        .bp:hover {
            transform: translateY(-3px)
        }
        
        .wo {
            position: fixed;
            inset: 0;
            z-index: 700;
            background: rgba(8, 8, 22, .78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .4s;
            overflow: hidden
        }
        .wo.on {
            opacity: 1;
            pointer-events: all
        }
        .rays {
            position: absolute;
            width: 160vmax;
            height: 160vmax;
            left: 50%;
            top: 50%;
            margin: -80vmax 0 0 -80vmax;
            opacity: 0;
            transition: opacity 1s;
            background: repeating-conic-gradient(rgba(255, 255, 255, .14) 0 6deg, transparent 6deg 18deg);
            -webkit-mask: radial-gradient(circle, #000 0, transparent 55%);
            mask: radial-gradient(circle, #000 0, transparent 55%);
            animation: rot 24s linear infinite
        }
        @keyframes rot {
            to {
                transform: rotate(360deg)
            }
        }
        .wo.open .rays {
            opacity: 1
        }
        .flash {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none
        }
        .wo.open .flash {
            animation: fl .8s
        }
        @keyframes fl {
            0% {
                opacity: .9
            }
            100% {
                opacity: 0
            }
        }
        .cap {
            position: relative;
            width: min(340px, 80vw);
            height: min(340px, 80vw);
            margin-bottom: 40px;
            animation: capin .7s cubic-bezier(.34, 1.56, .64, 1)
        }
        @keyframes capin {
            from {
                transform: scale(.2) translateY(200px)
            }
        }
        .cap.shake {
            animation: cs .12s infinite
        }
        @keyframes cs {
            25% {
                transform: translate(-5px, 3px) rotate(-3deg)
            }
            50% {
                transform: translate(5px, -3px) rotate(3deg)
            }
            75% {
                transform: translate(-3px, -4px) rotate(-2deg)
            }
        }
        .half {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            transition: 1.1s cubic-bezier(.34, 1.56, .64, 1)
        }
        .top {
            top: 0;
            border-radius: 999px 999px 0 0;
            z-index: 3;
            box-shadow: inset -12px -8px 24px rgba(0, 0, 0, .3), inset 12px 10px 24px rgba(255, 255, 255, .55)
        }
        .bot {
            bottom: 0;
            border-radius: 0 0 999px 999px;
            z-index: 1;
            background: radial-gradient(circle at 40% 15%, #fff, #e4e7ec 60%, #a5adb8);
            box-shadow: inset -12px -12px 24px rgba(0, 0, 0, .25), inset 12px 8px 24px #fff
        }
        .wo.open .top {
            transform: translateY(-190px) rotate(-24deg);
            opacity: 0
        }
        .wo.open .bot {
            transform: translateY(190px) rotate(16deg);
            opacity: 0
        }
        .glowc {
            position: absolute;
            inset: -30%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, .6), transparent 65%);
            opacity: 0;
            transition: .6s
        }
        .wo.open .glowc {
            opacity: 1
        }
        .wname {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 92vw;
            max-width: 1100px;
            text-align: center;
            font-weight: 900;
            color: #fff;
            font-size: clamp(2.2rem, 9vw, 5.5rem);
            line-height: 1.15;
            transform: translate(-50%, -50%) scale(.3);
            opacity: 0;
            z-index: 5;
            transition: .8s cubic-bezier(.34, 1.56, .64, 1) .25s;
            word-break: break-word
        }
        .wo.open .wname {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1)
        }
        .crown {
            position: absolute;
            top: -14%;
            left: 50%;
            transform: translate(-50%, 20px) scale(0);
            font-size: 4rem;
            z-index: 6;
            transition: .7s cubic-bezier(.34, 1.56, .64, 1) .6s
        }
        .wo.open .crown {
            transform: translate(-50%, 0) scale(1)
        }
        .cont {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, .95);
            color: var(--red2);
            border: 0;
            padding: 14px 56px;
            border-radius: 50px;
            cursor: pointer;
            font: 900 1.4rem 'Kanit';
            box-shadow: 0 15px 35px rgba(0, 0, 0, .35);
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: .4s
        }
        .wo.open .cont {
            opacity: 1;
            transform: none;
            transition-delay: 1s;
            pointer-events: all
        }
        .cont:hover {
            transform: scale(1.08) !important
        }
        .skip {
            position: absolute;
            bottom: calc(22px + env(safe-area-inset-bottom, 0px));
            color: #fff;
            opacity: .6;
            font-size: .85rem
        }
        .toast {
            position: fixed;
            bottom: calc(46px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translate(-50%, 30px);
            background: var(--ink);
            color: var(--bg1);
            padding: 8px 20px;
            border-radius: 30px;
            opacity: 0;
            transition: .4s;
            z-index: 1000;
            pointer-events: none
        }
        .toast.on {
            opacity: 1;
            transform: translate(-50%, 0)
        }
    </style>
</head>
<body>
    <div class="bokeh" id="bokeh"></div>
    <canvas id="confetti"></canvas>
    <div class="logw col" id="logw">
        <div class="logc">
            <h3>🏆 ผู้โชคดี <span><button class="mini" onclick="copyLog()">คัดลอก</button></span></h3>
            <ul id="logList">
                <li class="empty">ยังไม่มีผู้โชคดี</li>
            </ul>
        </div>
        <button class="tog" onclick="toggleLog()" aria-label="เปิด/ปิดรายชื่อผู้โชคดี"><span id="arr">▶</span></button>
    </div>
    <div class="badge">เหลือ <b id="count">0</b> คน</div>
    <div class="panel">
        <button class="cbtn" onclick="toggleSettings()" title="จัดการรายชื่อ">⚙️</button>
        <button class="cbtn" id="soundBtn" onclick="toggleSound()" title="เสียง">🔊</button>
        <button class="cbtn" style="color:var(--red)" onclick="resetList()" title="รีเซ็ต">↺</button>
    </div>
    <div id="stage">
        <div class="glow"></div>
        <div class="dome" id="dome"><canvas id="gc"></canvas></div>
        <div class="ring"></div>
        <div class="base">
            <div class="lights"><i></i><i></i><i></i><i></i><i></i></div>
            <div class="plate">GACHAPON</div>
            <div class="knoba" onclick="spinGacha(event)">
                <div class="knob" id="knob"></div>
            </div>
            <div class="chute">
                <div class="rball" id="rball"></div>
            </div>
        </div>
    </div>
    <div class="hint">คลิกตู้เพื่อเขย่า · หมุนปุ่มหรือกด Space เพื่อสุ่ม</div>
    <div class="modal" id="modal">
        <div class="mc">
            <h2>📝 รายชื่อผู้โชคดี</h2>
            <textarea id="names" oninput="onNames()" placeholder="พิมพ์ชื่อ บรรทัดละ 1 คน">สมชาย
สมหญิง
ประวิทย์
สุดา
มานะ
ปิติ
วีระ
ชูใจ
เก่งกาจ
วันเพ็ญ</textarea>
            <label class="opt"><input type="checkbox" id="noRepeat" checked onchange="onNames()"> ไม่สุ่มซ้ำคนที่ได้แล้ว</label>
            <button class="bp" onclick="toggleSettings()">บันทึก &amp; ปิด</button>
        </div>
    </div>
    <div class="wo" id="wo">
        <div class="rays"></div>
        <div class="flash"></div>
        <div class="cap" id="cap">
            <div class="glowc"></div>
            <div class="wname" id="wname"></div>
            <div class="crown"> </div>
            <div class="half top" id="ctop"></div>
            <div class="half bot"></div>
        </div>
        <button class="cont" onclick="closeWinner()">ดำเนินการต่อ</button>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        const $=id=>document.getElementById(id);
const stage=$('stage'),namesEl=$('names'),countEl=$('count'),knob=$('knob'),rball=$('rball'),wo=$('wo'),cap=$('cap'),dome=$('dome');
const COLORS=[['#ff5a5f','#a8202c'],['#34ace0','#1b6f99'],['#ffb142','#c27a10'],['#33d9b2','#13805f'],['#a29bfe','#5b50c9'],['#ff78c4','#b3307f'],['#7bed9f','#2f9e55'],['#feca57','#c9962a']];
let winners=[],busy=false,muted=false,stir=0;
let AC=null;
const ctxA=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
try{const s=localStorage.getItem('gacha-names');if(s)namesEl.value=s;}catch(e){}
function allNames(){return namesEl.value.split('\n').map(n=>n.trim()).filter(Boolean)}
function remaining(){
  const a=allNames();
  if($('noRepeat').checked)winners.forEach(w=>{const i=a.indexOf(w.name);if(i>-1)a.splice(i,1)});
  return a;
}
function updateCount(){
  const c=remaining().length;
  if(countEl.textContent!=String(c)){countEl.textContent=c;countEl.classList.remove('pop');void countEl.offsetWidth;countEl.classList.add('pop')}
}
function onNames(){updateCount();try{localStorage.setItem('gacha-names',namesEl.value)}catch(e){}}
function toggleSettings(){$('modal').classList.toggle('on')}
function toggleLog(){const c=$('logw').classList.toggle('col');$('arr').textContent=c?'▶':'◀'}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function toggleSound(){muted=!muted;$('soundBtn').textContent=muted?'🔇':'🔊';if(!muted)ctxA().resume()}
function tone(f,type,d,v,delay=0,slide=0){
  if(muted)return;const a=ctxA(),t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);
}
const fanfare=()=>[523,659,784,1047].forEach((f,i)=>tone(f,'triangle',.5,.22,i*.1));
const gc=$('gc'),g=gc.getContext('2d');const S=386;let dpr=Math.min(devicePixelRatio||1,2);
gc.width=gc.height=S*dpr;g.scale(dpr,dpr);
const R=S/2,BR=23,balls=[];
for(let i=0;i<30;i++){const a=Math.random()*6.28,r=Math.random()*(R-BR-20);
  balls.push({x:R+Math.cos(a)*r*.8,y:R+60+Math.random()*100,vx:0,vy:0,rot:Math.random()*6.28,vr:0,c:COLORS[i%COLORS.length]})}
function physics(){
  const gr=.42;
  for(const b of balls){
    b.vy+=gr;
    if(stir>0){b.vx+=(Math.random()-.5)*4*stir;b.vr+=(Math.random()-.5)*.3*stir;
      if(b.y>R+25)b.vy-=Math.random()*2.2*stir;      
      if(b.y<R+5)b.vy+=.9;                            
    }else if(b.y<R+5)b.vy+=.5;                        
    b.x+=b.vx;b.y+=b.vy;b.rot+=b.vr;b.vx*=.99;b.vr*=.9;
    if(Math.abs(b.vr)<.004)b.vr=0;
    const dx=b.x-R,dy=b.y-R,d=Math.hypot(dx,dy),m=R-BR-8;
    if(d>m){const nx=dx/d,ny=dy/d,dot=b.vx*nx+b.vy*ny;b.x=R+nx*m;b.y=R+ny*m;
      if(dot>0){const e=dot>1.2?1.5:1.0;b.vx-=e*dot*nx;b.vy-=e*dot*ny}
      b.vx*=.85;b.vy*=.85;if(stir>0)b.vr+=nx*.04}
    if(stir<=0&&Math.abs(b.vx)<.12&&Math.abs(b.vy)<.5){b.vx*=.5}
  }
  for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
    const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,min=BR*2;
    if(d<min){const nx=dx/d,ny=dy/d,o=(min-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
      const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const j2=-rv*(rv<-1.5?.7:.5);a.vx-=j2*nx;a.vy-=j2*ny;b.vx+=j2*nx;b.vy+=j2*ny}}
  }
}
function drawBall(b){
  g.save();g.translate(b.x,b.y);g.rotate(b.rot);
  g.shadowColor='rgba(0,0,0,.3)';g.shadowBlur=6;g.shadowOffsetY=3;
  g.beginPath();g.arc(0,0,BR,0,6.283);g.fillStyle='#fff';g.fill();g.shadowColor='transparent';
  g.save();g.beginPath();g.arc(0,0,BR,0,6.283);g.clip();
  const t=g.createLinearGradient(0,-BR,0,0);t.addColorStop(0,b.c[0]);t.addColorStop(1,b.c[1]);
  g.fillStyle=t;g.fillRect(-BR,-BR,BR*2,BR);
  g.fillStyle='#e9edf2';g.fillRect(-BR,0,BR*2,BR);
  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(-BR,-1.5,BR*2,3);g.restore();
  g.rotate(-b.rot);
  const s=g.createRadialGradient(-BR*.35,-BR*.4,1,0,0,BR);s.addColorStop(0,'rgba(255,255,255,.75)');s.addColorStop(.35,'rgba(255,255,255,0)');s.addColorStop(1,'rgba(0,0,0,.28)');
  g.beginPath();g.arc(0,0,BR,0,6.283);g.fillStyle=s;g.fill();g.restore();
}
function loop(){
  physics();physics();g.clearRect(0,0,S,S);balls.forEach(drawBall);
  if(stir>0)stir=Math.max(0,stir-.012);requestAnimationFrame(loop);
}
loop();
function shakeMachine(){
  if(busy)return;ctxA().resume();tone(140,'triangle',.2,.25,0,70);
  stage.classList.remove('shk');void stage.offsetWidth;stage.classList.add('shk');stir=.8;
}
dome.addEventListener('click',shakeMachine);
function spinGacha(e){
  if(e)e.stopPropagation();ctxA().resume();
  const list=remaining();
  if(!list.length){toast(winners.length?'สุ่มครบทุกคนแล้ว กด ↺ เพื่อเริ่มใหม่':'กรุณาเติมรายชื่อก่อนหมุน!');if(!winners.length)toggleSettings();return}
  if(busy)return;busy=true;document.body.classList.add('busy');
  knob.classList.add('spin');stir=1.6;
  for(let i=0;i<6;i++)tone(180+i*30,'square',.12,.08,i*.15);
  const col=COLORS[Math.floor(Math.random()*COLORS.length)];
  setTimeout(()=>{
    knob.classList.remove('spin');
    rball.style.background=`radial-gradient(circle at 35% 28%,#fff 0,${col[0]} 32%,${col[1]} 100%)`;
    rball.classList.add('drop');tone(500,'sine',.35,.25,.45,150);tone(350,'sine',.25,.15,.7,120);
    setTimeout(()=>reveal(col,list),1300);
  },1400);
}
function reveal(col,list){
  const w=list[Math.floor(Math.random()*list.length)];
  $('ctop').style.background=`radial-gradient(circle at 35% 25%,#fff 0,${col[0]} 35%,${col[1]} 100%)`;
  $('wname').textContent=w;
  $('wname').style.textShadow=`0 8px 28px rgba(0,0,0,.5),0 0 50px ${col[0]}`;
  wo.classList.remove('open');wo.classList.add('on');cap.classList.add('shake');
  let t=0;const iv=setInterval(()=>{tone(160+t*25,'square',.08,.09);t++},200);
  setTimeout(()=>{
    clearInterval(iv);cap.classList.remove('shake');fanfare();wo.classList.add('open');
    burst();addLog(w,col[0]);
  },2200);
}
function addLog(name,color){
  winners.push({name,color});
  if(winners.length===1)$('logList').innerHTML='';
  const li=document.createElement('li');li.className='li';
  li.innerHTML=`<em></em><i></i><span></span>`;
  li.children[0].textContent=winners.length+'.';li.children[1].style.background=color;li.children[2].textContent=name;
  $('logList').prepend(li);
  if(winners.length===1&&$('logw').classList.contains('col'))toggleLog();
  updateCount();
}
function closeWinner(){
  wo.classList.remove('on','open');rball.classList.remove('drop');
  busy=false;document.body.classList.remove('busy');
}
function resetList(){
  if(!confirm('เริ่มใหม่ทั้งหมดหรือไม่? (รายชื่อผู้โชคดีจะถูกลบ)'))return;
  winners=[];$('logList').innerHTML='<li class="empty">ยังไม่มีผู้โชคดี</li>';updateCount();toast('รีเซ็ตเรียบร้อย');
}
function copyLog(){
  if(!winners.length)return toast('ยังไม่มีรายชื่อ');
  const t=winners.map((w,i)=>`${i+1}. ${w.name}`).join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('คัดลอกแล้ว ✓')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('คัดลอกแล้ว ✓')}catch(e){toast('คัดลอกไม่สำเร็จ')}ta.remove();
  });
}
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!$('modal').classList.contains('on')){e.preventDefault();
    if(wo.classList.contains('open'))closeWinner();else if(!wo.classList.contains('on'))spinGacha()}
  if(e.code==='Escape')$('modal').classList.remove('on');
});
const cv=$('confetti'),cx=cv.getContext('2d');let parts=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',()=>{size();fit()});
function burst(){
  const cols=['#ff5a5f','#34ace0','#ffb142','#33d9b2','#a29bfe','#feca57','#ff78c4'];
  for(let i=0;i<220;i++){
    const side=i%2?1:-1,x=innerWidth/2,y=innerHeight*.55,a=-Math.PI/2+(Math.random()-.5)*1.7,v=Math.random()*18+8;
    parts.push({x:x+side*20,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:cols[i%cols.length],s:Math.random()*10+5,r:Math.random()*6,vr:(Math.random()-.5)*.4,sh:Math.random()>.5,life:0});
  }
  if(!run){run=true;tick()}
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.y<cv.height+30&&p.life<400);
  for(const p of parts){
    p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,(400-p.life)/60);
    if(p.sh)cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);else{cx.beginPath();cx.arc(0,0,p.s/2,0,6.283);cx.fill()}
    cx.restore();
  }
  if(parts.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}
}
function fit(){
  const s=Math.min(1,(innerHeight-40)/700,(innerWidth-20)/450);
  stage.style.transform=`scale(${s})`;stage.style.margin=`${-(690*(1-s))/2}px ${-(440*(1-s))/2}px`;
}
fit();
const bk=$('bokeh');
for(let i=0;i<14;i++){const e=document.createElement('i'),s=30+Math.random()*90;
  e.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${14+Math.random()*20}s;animation-delay:${-Math.random()*30}s;opacity:${.25+Math.random()*.4}`;bk.appendChild(e)}
updateCount();
    </script>
</body>
</html>
