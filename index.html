<!DOCTYPE html>
<html lang="th" data-theme="milk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App Portal | milkomilk</title>
    <link rel="icon" type="image/png" href="https://patawee-erc.github.io/profile/logo_milkomilk.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
    <style>
        
        :root {
            
            --sp-0: 0px;
            --sp-25: 2px;
            --sp-50: 4px;
            --sp-75: 8px;
            --sp-100: 12px;
            --sp-200: 16px;
            --sp-300: 24px;
            --sp-400: 32px;
            --sp-500: 40px;
            --sp-600: 48px;
            --sp-700: 64px;
            --sp-800: 80px;
            --sp-900: 96px;
            
            --r-0: 0px;
            --r-2: 2px;
            --r-4: 4px;
            --r-6: 6px;
            --r-8: 8px;
            --r-12: 12px;
            --r-16: 16px;
            --r-24: 24px;
            --r-full: 9999px;
            
            --ease-base: cubic-bezier(0.22, 1, 0.36, 1);
            --dur-layout: 500ms;
            --dur-color: 300ms;
            
            --font-family: 'Poppins', 'Noto Sans Thai', sans-serif;
            
            --surface-canvas: #faf8f3;
            --surface-primary: #ffffff;
            --surface-secondary: #f4efe6;
            --surface-subtle: #ede6d8;
            --border-primary: #e2ddd2;
            --border-focus: #c2410c;
            --text-primary: #181818;
            --text-secondary: #52525b;
            --text-subtle: #71717a;
            --text-muted-tagline: rgba(24, 24, 24, 0.28);
            --action-primary: #dc2626;
            --action-primary-hover: #b91c1c;
            --action-primary-active: #991b1b;
            --action-fg: #ffffff;
            
            --hero-gradient: linear-gradient(90deg, #000000 0%, #666666 100%);
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 12px 24px -10px rgba(0, 0, 0, 0.08);
        }
        [data-theme="night"] {
            
            --surface-canvas: #181818;
            --surface-primary: #1f1f1f;
            --surface-secondary: #272727;
            --surface-subtle: #313131;
            --border-primary: #313131;
            --border-focus: #ef4444;
            --text-primary: #ffffff;
            --text-secondary: #d4d4d8;
            --text-subtle: #a1a1aa;
            --text-muted-tagline: rgba(255, 255, 255, 0.28);
            --action-primary: #ef4444;
            --action-primary-hover: #dc2626;
            --action-primary-active: #b91c1c;
            --action-fg: #ffffff;
            
            --hero-gradient: linear-gradient(90deg, #ffffff 0%, #9b9b9b 100%);
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.35);
            --shadow-hover: 0 12px 28px -8px rgba(0, 0, 0, 0.45);
        }
        
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
        body {
            margin: var(--sp-0);
            min-height: 100vh;
            font-family: var(--font-family);
            font-size: 16px;
            line-height: 24px;
            color: var(--text-primary);
            background-color: var(--surface-canvas);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color var(--dur-color) var(--ease-base), color var(--dur-color) var(--ease-base);
        }
        .skip-link {
            position: absolute;
            top: -100px;
            left: var(--sp-200);
            padding: var(--sp-75) var(--sp-100);
            background: var(--action-primary);
            color: var(--action-fg);
            border-radius: var(--r-6);
            font-size: 14px;
            font-weight: 600;
            z-index: 100;
            text-decoration: none;
            transition: transform var(--dur-color) var(--ease-base);
        }
        .skip-link:focus {
            top: var(--sp-200);
        }
        
        header {
            padding: var(--sp-700) var(--sp-300) var(--sp-400);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .logo-wrap {
            width: 200px;
            height: 200px;
            margin-bottom: var(--sp-300);
            padding: var(--sp-50);
            background: var(--surface-primary);
            border: 1px solid var(--border-primary);
            border-radius: var(--r-24);
            box-shadow: var(--shadow-card);
            display: grid;
            place-items: center;
        }
        .logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: var(--r-16);
        }
        
        h1.hero-heading {
            margin: var(--sp-0) var(--sp-0) var(--sp-100);
            max-width: 680px;
            font-size: 60px;
            line-height: 60px;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: var(--hero-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-wrap: balance;
        }
        
        .hero-subtitle {
            margin: var(--sp-0) var(--sp-0) var(--sp-400);
            max-width: 680px;
            font-size: 18px;
            line-height: 28px;
            font-weight: 500;
            color: var(--text-secondary);
            text-wrap: balance;
        }
        
        .search-box {
            position: relative;
            width: 100%;
            max-width: 540px;
            margin: var(--sp-0) auto;
        }
        .search-box i {
            position: absolute;
            left: var(--sp-200);
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: var(--text-subtle);
            pointer-events: none;
        }
        .search-box input {
            width: 100%;
            padding: var(--sp-200) var(--sp-600) var(--sp-200) var(--sp-600);
            font-family: inherit;
            font-size: 16px;
            line-height: 24px;
            font-weight: 400;
            color: var(--text-primary);
            background-color: var(--surface-primary);
            border: 1px solid var(--border-primary);
            border-radius: var(--r-full);
            box-shadow: var(--shadow-card);
            outline: none;
            transition: border-color var(--dur-color) var(--ease-base), box-shadow var(--dur-color) var(--ease-base);
        }
        .search-box input:focus-visible {
            border-color: var(--border-focus);
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
        }
        .search-box kbd {
            position: absolute;
            right: var(--sp-200);
            top: 50%;
            transform: translateY(-50%);
            padding: var(--sp-25) var(--sp-75);
            font-size: 12px;
            line-height: 16px;
            font-weight: 600;
            color: var(--text-subtle);
            background: var(--surface-secondary);
            border: 1px solid var(--border-primary);
            border-radius: var(--r-4);
            pointer-events: none;
        }
        .count-text {
            margin-top: var(--sp-200);
            font-size: 14px;
            line-height: 20px;
            font-weight: 500;
            color: var(--text-subtle);
        }
        
        .tagline-section {
            max-width: 680px;
            margin: var(--sp-400) auto var(--sp-600);
            padding: var(--sp-0) var(--sp-300);
            text-align: center;
        }
        .tagline-text {
            margin: var(--sp-0);
            font-size: 30px;
            line-height: 36px;
            font-weight: 600;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }
        .tagline-text span.word {
            color: var(--text-muted-tagline);
            transition: color var(--dur-layout) var(--ease-base);
            display: inline-block;
            margin-right: 0.28em;
        }
        .tagline-text span.word.active {
            color: var(--text-primary);
        }
        
        .container {
            max-width: 1240px;
            margin: var(--sp-0) auto;
            padding: var(--sp-0) var(--sp-300) var(--sp-800);
        }
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--sp-200);
        }
        [data-layout="list"] .app-grid {
            grid-template-columns: 1fr;
            max-width: 760px;
            margin: var(--sp-0) auto;
            gap: var(--sp-100);
        }
        
        .card {
            position: relative;
            display: flex;
            align-items: center;
            gap: var(--sp-200);
            padding: var(--sp-200);
            background-color: var(--surface-primary);
            border: 1px solid var(--border-primary);
            border-radius: var(--r-16);
            box-shadow: var(--shadow-card);
            text-decoration: none;
            color: inherit;
            opacity: 0;
            transform: translateY(32px);
            transition:
                transform var(--dur-layout) var(--ease-base),
                opacity var(--dur-layout) var(--ease-base),
                background-color var(--dur-color) var(--ease-base),
                border-color var(--dur-color) var(--ease-base),
                box-shadow var(--dur-color) var(--ease-base);
        }
        .card.revealed {
            opacity: 1;
            transform: translateY(0);
        }
        
        .tile {
            flex-shrink: 0;
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            background-color: var(--surface-secondary);
            border-radius: var(--r-8);
            color: var(--text-primary);
            font-size: 24px;
            transition: background-color var(--dur-color) var(--ease-base), color var(--dur-color) var(--ease-base), transform var(--dur-color) var(--ease-base);
        }
        .card-body {
            flex: 1;
            min-width: 0;
        }
        .card-body h2 {
            margin: var(--sp-0);
            font-size: 16px;
            line-height: 24px;
            font-weight: 500;
            color: var(--text-primary);
            text-wrap: pretty;
        }
        .card-body p {
            margin: var(--sp-25) var(--sp-0) var(--sp-0);
            font-size: 14px;
            line-height: 20px;
            font-weight: 400;
            color: var(--text-subtle);
            text-wrap: pretty;
        }
        .arrow-badge {
            flex-shrink: 0;
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            border-radius: var(--r-full);
            border: 1px solid var(--border-primary);
            color: var(--text-subtle);
            font-size: 16px;
            transition: transform var(--dur-color) var(--ease-base), background-color var(--dur-color) var(--ease-base), color var(--dur-color) var(--ease-base), border-color var(--dur-color) var(--ease-base);
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            border-color: var(--border-focus);
        }
        .card:hover .tile {
            background-color: var(--action-primary);
            color: var(--action-fg);
            transform: scale(1.04);
        }
        .card:hover .arrow-badge {
            background-color: var(--action-primary);
            border-color: var(--action-primary);
            color: var(--action-fg);
            transform: translateX(2px);
        }
        .card:active {
            transform: scale(0.98);
        }
        .card:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
        }
        .empty-state {
            grid-column: 1 / -1;
            padding: var(--sp-700) var(--sp-300);
            text-align: center;
            color: var(--text-subtle);
        }
        .empty-state i {
            font-size: 36px;
            margin-bottom: var(--sp-100);
            display: block;
        }
        
        footer {
            padding: var(--sp-600) var(--sp-300) var(--sp-800);
            text-align: center;
            font-size: 14px;
            line-height: 20px;
            color: var(--text-subtle);
            border-top: 1px solid var(--border-primary);
        }
        
        .tweaks-toggle {
            position: fixed;
            right: var(--sp-300);
            bottom: var(--sp-300);
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: var(--r-full);
            background-color: var(--surface-primary);
            border: 1px solid var(--border-primary);
            color: var(--text-secondary);
            box-shadow: var(--shadow-card);
            cursor: pointer;
            z-index: 50;
            font-size: 20px;
            transition: transform var(--dur-color) var(--ease-base), border-color var(--dur-color) var(--ease-base);
        }
        .tweaks-toggle:hover {
            transform: rotate(30deg);
            border-color: var(--border-focus);
        }
        .tweaks-toggle:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
        }
        .tweaks-panel {
            position: fixed;
            right: var(--sp-300);
            bottom: 84px;
            width: 260px;
            padding: var(--sp-200);
            background-color: var(--surface-primary);
            border: 1px solid var(--border-primary);
            border-radius: var(--r-16);
            box-shadow: var(--shadow-hover);
            z-index: 50;
        }
        .tweaks-panel h3 {
            margin: var(--sp-0) var(--sp-0) var(--sp-100);
            font-size: 12px;
            line-height: 16px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--text-subtle);
        }
        .tweak-row {
            margin-top: var(--sp-100);
        }
        .tweak-label {
            display: block;
            margin-bottom: var(--sp-50);
            font-size: 12px;
            line-height: 16px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .seg-control {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 1fr;
            padding: var(--sp-25);
            background-color: var(--surface-secondary);
            border: 1px solid var(--border-primary);
            border-radius: var(--r-8);
        }
        .seg-control button {
            padding: var(--sp-75) var(--sp-100);
            
            font-family: inherit;
            font-size: 12px;
            line-height: 16px;
            font-weight: 600;
            border: var(--sp-0);
            border-radius: var(--r-6);
            background: transparent;
            color: var(--text-subtle);
            cursor: pointer;
            transition: background-color var(--dur-color) var(--ease-base), color var(--dur-color) var(--ease-base);
        }
        .seg-control button[aria-pressed="true"] {
            background-color: var(--action-primary);
            color: var(--action-fg);
        }
        
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
            .card {
                opacity: 1 !important;
                transform: none !important;
            }
            .tagline-text span.word {
                color: var(--text-primary) !important;
            }
        }
        [data-motion="off"] *,
        [data-motion="off"] *::before,
        [data-motion="off"] *::after {
            animation-duration: 0.01ms !important;
            transition-duration: 0.01ms !important;
        }
        [data-motion="off"] .card {
            opacity: 1 !important;
            transform: none !important;
        }
        [data-motion="off"] .tagline-text span.word {
            color: var(--text-primary) !important;
        }
        
        @media (max-width: 640px) {
            header {
                padding-top: var(--sp-500);
            }
            h1.hero-heading {
                font-size: 36px;
                line-height: 40px;
            }
            .hero-subtitle {
                font-size: 16px;
                line-height: 24px;
            }
            .tagline-text {
                font-size: 24px;
                line-height: 32px;
            }
            .search-box kbd {
                display: none;
            }
            .app-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <a href="#mainContent" class="skip-link">ข้ามไปยังเนื้อหาหลัก</a>
    
    <header>
        <div class="logo-wrap">
            <img class="logo" src="https://patawee-erc.github.io/profile/logo_milkomilk.png" alt="milkomilk logo" width="136" height="136">
        </div>
        <h1 class="hero-heading">My App Portal<br></h1>
        <p class="hero-subtitle"></p>
        <div class="search-box" role="search">
            <i class="ph-bold ph-magnifying-glass" aria-hidden="true"></i>
            <input type="search" id="appSearch" placeholder="ค้นหาชื่อระบบหรือฟังก์ชัน..." autocomplete="off" aria-label="ค้นหาระบบงาน">
            <kbd aria-hidden="true">/</kbd>
        </div>
        <p class="count-text" id="countDisplay" aria-live="polite">กำลังโหลดระบบ...</p>
    </header>
    
    <section class="tagline-section" aria-label="Product Tagline">
        <p class="tagline-text" id="revealTagline">
            ศูนย์รวมแอปพลิเคชันและเครื่องมือช่วยงานครบวงจร ออกแบบเพื่อการเข้าถึงที่รวดเร็วและแม่นยำในทุกวัน
        </p>
    </section>
    
    <main class="container" id="mainContent">
        <div class="app-grid" id="appGrid"></div>
    </main>
    
    <footer>
        <p>&copy; 2025 milkomilk. All rights reserved.</p>
    </footer>
    
    <button class="tweaks-toggle" id="tweaksToggle" aria-expanded="false" aria-controls="tweaksPanel" aria-label="ปรับแต่งการแสดงผล" title="ปรับแต่ง (T)">
        <i class="ph-bold ph-sliders-horizontal"></i>
    </button>
    <aside class="tweaks-panel" id="tweaksPanel" hidden>
        <h3>การแสดงผล</h3>
        <div class="tweak-row">
            <span class="tweak-label">ธีมสี</span>
            <div class="seg-control" data-key="theme">
                <button type="button" data-value="milk">สว่าง</button>
                <button type="button" data-value="night">มืด</button>
            </div>
        </div>
        <div class="tweak-row">
            <span class="tweak-label">มุมมอง</span>
            <div class="seg-control" data-key="layout">
                <button type="button" data-value="grid">ตาราง</button>
                <button type="button" data-value="list">รายการ</button>
            </div>
        </div>
        <div class="tweak-row">
            <span class="tweak-label">การเคลื่อนไหว</span>
            <div class="seg-control" data-key="motion">
                <button type="button" data-value="on">เปิด</button>
                <button type="button" data-value="off">ปิด</button>
            </div>
        </div>
    </aside>
    <script>
        
        const APPS = [
            { icon: 'ph-bold ph-user-circle', title: 'About Me', desc: 'ข้อมูลประวัติและการติดต่อ', href: 'https://patawee-erc.github.io/profile/' },

            { icon: 'ph-bold ph-presentation', title: 'HTML to PPTX', desc: 'เครื่องมือแปลงเอกสารเว็บเป็น PowerPoint', href: 'https://patawee-erc.github.io/GeminiExportHtml/' },
            { icon: 'ph-bold ph-image', title: 'Image Resizer', desc: 'เครื่องมือปรับและย่อขนาดรูปภาพ', href: 'https://patawee-erc.github.io/resize/' },
            { icon: 'ph-bold ph-dice-five', title: 'Dices Sim', desc: 'ระบบจำลองการทอยลูกเต๋าแบบสามมิติ', href: 'https://patawee-erc.github.io/dice/' },
            { icon: 'ph-bold ph-chalkboard-teacher', title: 'Multiple HTML to PPTX', desc: 'เครื่องมือแปลงหลายเว็บเพจเป็น PowerPoint', href: 'https://patawee-erc.github.io/GeminiExportHtml/v2.html' },
            { icon: 'ph-bold ph-slideshow', title: 'MyPresent', desc: 'เครื่องมือสร้างงานนำเสนอแบบกำหนดเอง', href: 'https://patawee-erc.github.io/mypresent/' },
            { icon: 'ph-bold ph-presentation-chart', title: 'Template PowerPoint ERC', desc: 'เทมเพลตมาตรฐานสำหรับงานนำเสนอ', href: 'https://patawee-erc.github.io/pptx/' },
            { icon: 'ph-bold ph-identification-card', title: 'Face Recognition', desc: 'ระบบบันทึกเวลาปฏิบัติงานด้วยใบหน้า', href: 'https://patawee-erc.github.io/New_Face_Scan/' },
            { icon: 'ph-bold ph-code-block', title: 'HTML Text Editor', desc: 'โปรแกรมแก้ไขข้อความและดูพรีวิวเว็บ', href: 'https://patawee-erc.github.io/html_text_edit/' },
            { icon: 'ph-bold ph-map-pin', title: 'Map Pin', desc: 'แผนที่ประเทศไทยพร้อมรัศมีหมุดพิกัด', href: 'https://patawee-erc.github.io/mappin/' },
            { icon: 'ph-bold ph-guitar', title: 'Guitar Chord', desc: 'ตารางคอร์ดกีตาร์และวิธีจับ', href: 'https://patawee-erc.github.io/chrord/' },
            { icon: 'ph-bold ph-hand-pointing', title: 'Hand Tracking', desc: 'ระบบตรวจจับท่าทางมือผ่านกล้องวิดีโอ', href: 'https://patawee-erc.github.io/HandTracking/' },
            { icon: 'ph-bold ph-file-pdf', title: 'Watermark PDF', desc: 'โปรแกรมประทับลายน้ำลงบนไฟล์เอกสาร', href: 'https://patawee-erc.github.io/WatermarkPDF/' },
            { icon: 'ph-bold ph-tree-structure', title: 'Network Diagnostic Tools', desc: 'ระบบวิเคราะห์เส้นทางเครือข่าย', href: 'https://patawee-erc.github.io/Network_Diagnostic_Tools/' },
            { icon: 'ph-bold ph-file-text', title: 'OCR PDF V2', desc: 'ระบบสแกนแปลงข้อความจากเอกสารพีดีเอฟ', href: 'https://patawee-erc.github.io/ocr/ocr2.html' },
            { icon: 'ph-bold ph-file-pdf', title: 'PDF Tool', desc: 'เครื่องมือจัดการหน้าและลายน้ำเอกสาร', href: 'https://patawee-erc.github.io/WatermarkPDF/v2.html' },
            { icon: 'ph-bold ph-palette', title: 'Color Contrast Checker', desc: 'เครื่องมือตรวจสอบอัตราคอนทราสต์คู่สี', href: 'https://patawee-erc.github.io/colorchecker/' },
            { icon: 'ph-bold ph-guitar', title: 'Guitar Chord Player Studio', desc: 'โปรแกรมจำลองเสียงคอร์ดกีตาร์', href: 'https://patawee-erc.github.io/GuitarPlayer/' },
            { icon: 'ph-bold ph-files', title: 'Split PDF', desc: 'เครื่องมือแยกและบีบอัดเอกสารพีดีเอฟ', href: 'https://patawee-erc.github.io/pdfsplit/' },
            { icon: 'ph-bold ph-path', title: 'Gas Pipeline System', desc: 'ระบบแผนที่โครงข่ายท่อส่งก๊าซธรรมชาติ', href: 'https://patawee-erc.github.io/mappin/gaspipeline.html' }
        ];
        const grid = document.getElementById('appGrid');
        const input = document.getElementById('appSearch');
        const countDisplay = document.getElementById('countDisplay');
        
        grid.innerHTML = APPS.map((app) => `
            <a href="${app.href}" class="card" target="_blank" rel="noopener noreferrer" data-search="${(app.title + ' ' + app.desc).toLowerCase()}">
                <span class="tile" aria-hidden="true">
                    <i class="${app.icon}"></i>
                </span>
                <span class="card-body">
                    <h2>${app.title}</h2>
                    <p>${app.desc}</p>
                </span>
                <span class="arrow-badge" aria-hidden="true">
                    <i class="ph-bold ph-caret-right"></i>
                </span>
            </a>
        `).join('') + `
            <div class="empty-state" id="emptyState" hidden>
                <i class="ph-bold ph-magnifying-glass"></i>
                <p>ไม่พบระบบที่ตรงกับคำค้นหา</p>
            </div>
        `;
        const cards = [...grid.querySelectorAll('.card')];
        const emptyState = document.getElementById('emptyState');
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('revealed');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });
        cards.forEach(card => observer.observe(card));
        
        function handleFilter() {
            const query = input.value.trim().toLowerCase();
            let count = 0;
            cards.forEach(card => {
                const match = !query || card.dataset.search.includes(query);
                card.hidden = !match;
                if (match) {
                    count++;
                    card.classList.add('revealed');
                }
            });
            emptyState.hidden = count !== 0;
            countDisplay.textContent = query ? `พบ ${count} จาก ${cards.length} ระบบ` : `ระบบทั้งหมด ${cards.length} รายการ`;
        }
        input.addEventListener('input', handleFilter);
        handleFilter();
        
        document.addEventListener('keydown', (e) => {
            const isTyping = /input|textarea/i.test(document.activeElement.tagName);
            if (e.key === '/' && !isTyping) {
                e.preventDefault();
                input.focus();
            }
            if ((e.key === 't' || e.key === 'T') && !isTyping && !e.metaKey && !e.ctrlKey) {
                toggleTweaks();
            }
            if (e.key === 'Escape') {
                if (input.value) {
                    input.value = '';
                    handleFilter();
                }
                closeTweaks();
            }
        });
        
        const taglineEl = document.getElementById('revealTagline');
        const words = taglineEl.textContent.trim().split(/\s+/);
        taglineEl.innerHTML = words.map(w => `<span class="word">${w}</span>`).join(' ');
        const wordNodes = taglineEl.querySelectorAll('.word');
        const taglineObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    wordNodes.forEach((node, idx) => {
                        setTimeout(() => node.classList.add('active'), idx * 70);
                    });
                    taglineObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.3 });
        taglineObserver.observe(taglineEl);
        
        const root = document.documentElement;
        const panel = document.getElementById('tweaksPanel');
        const toggle = document.getElementById('tweaksToggle');
        const defaultPrefs = { theme: 'milk', layout: 'grid', motion: 'on' };
        let prefs = { ...defaultPrefs };
        try {
            prefs = { ...defaultPrefs, ...JSON.parse(localStorage.getItem('portal_prefs') || '{}') };
        } catch (_) {}
        function applyPreferences() {
            root.dataset.theme = prefs.theme;
            root.dataset.layout = prefs.layout;
            root.dataset.motion = prefs.motion;
            document.querySelectorAll('.seg-control').forEach(seg => {
                const key = seg.dataset.key;
                seg.querySelectorAll('button').forEach(btn => {
                    btn.setAttribute('aria-pressed', String(btn.dataset.value === prefs[key]));
                });
            });
        }
        document.querySelectorAll('.seg-control').forEach(seg => {
            seg.addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (!btn) return;
                prefs[seg.dataset.key] = btn.dataset.value;
                applyPreferences();
                try {
                    localStorage.setItem('portal_prefs', JSON.stringify(prefs));
                } catch (_) {}
            });
        });
        function openTweaks() {
            panel.hidden = false;
            toggle.setAttribute('aria-expanded', 'true');
        }
        function closeTweaks() {
            panel.hidden = true;
            toggle.setAttribute('aria-expanded', 'false');
        }
        function toggleTweaks() {
            panel.hidden ? openTweaks() : closeTweaks();
        }
        toggle.addEventListener('click', toggleTweaks);
        applyPreferences();
    </script>
</body>
</html>
