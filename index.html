<!DOCTYPE html>
<html lang="th" data-theme="milk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App Portal | milkomilk</title>
    <link rel="icon" type="image/png" href="https://patawee-erc.github.io/profile/logo_milkomilk.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ink: #1f2a2c;
            --ink-soft: #3b4749;
            --muted: #5f6c6f;
            --milk: #faf8f3;
            --paper: #ffffff;
            --cream: #f1ece0;
            --mist: #e4eaeb;
            --line: #e8e4d9;

            --accent-from: #e53935;
            --accent-to: #b71c1c;
            --accent-fg: #ffffff;
            --blob-a: #efe6d2;
            --blob-b: #dde7e9;
            --r-card: 22px;
            --r-tile: 16px;
            --shadow-1: 0 1px 2px rgba(31, 42, 44, .04), 0 4px 14px rgba(31, 42, 44, .04);
            --shadow-2: 0 2px 4px rgba(31, 42, 44, .05), 0 14px 34px rgba(31, 42, 44, .09);
            --shadow-3: 0 4px 8px rgba(31, 42, 44, .06), 0 26px 56px rgba(31, 42, 44, .16);
            --ease: cubic-bezier(.22, .8, .24, 1);
            --font: 'Nunito', 'Noto Sans Thai', sans-serif;
        }

        [data-theme="night"] {
            --ink: #f4f1ea;
            --ink-soft: #d9d5ca;
            --muted: #9aa7aa;
            --milk: #121819;
            --paper: #1a2122;
            --cream: #263032;
            --mist: #2a3436;
            --line: #2b3537;

            --accent-from: #ef5350;
            --accent-to: #c62828;
            --accent-fg: #ffffff;
            --blob-a: #2a2a22;
            --blob-b: #1b2b2f;
            --shadow-1: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .2);
            --shadow-2: 0 2px 4px rgba(0, 0, 0, .35), 0 14px 34px rgba(0, 0, 0, .35);
            --shadow-3: 0 4px 8px rgba(0, 0, 0, .4), 0 26px 56px rgba(0, 0, 0, .5);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        ::selection {
            background: #ef5350;
            color: #ffffff;
        }

        [hidden] {
            display: none !important;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.6;
            color: var(--ink);
            background: var(--milk);
            overflow-x: hidden;
            transition: background .4s var(--ease), color .4s var(--ease);
            -webkit-font-smoothing: antialiased;
        }

        .ambient {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .ambient span {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .75;
            transition: background .4s var(--ease);
        }

        .ambient .a {
            width: 560px;
            height: 560px;
            background: var(--blob-a);
            top: -180px;
            right: -120px;
        }

        .ambient .b {
            width: 460px;
            height: 460px;
            background: var(--blob-b);
            bottom: -160px;
            left: -140px;
        }

        header {
            text-align: center;
            padding: 56px 20px 36px;
        }

        .logo-plate {
            display: block;
            width: clamp(170px, 26vw, 230px);
            aspect-ratio: 1;
            margin: 0 auto 18px;
            padding: 6px;
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 36px;
            box-shadow: var(--shadow-2);
            overflow: hidden;
            animation: logoIn 1s var(--ease) both, float 7s ease-in-out 1s infinite;
        }

        .logo {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3.1rem);
            font-weight: 800;
            letter-spacing: -.02em;
            line-height: 1.15;
            background: linear-gradient(180deg, var(--ink) 30%, var(--ink-soft));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeUp .8s var(--ease) .15s both;
        }

        .subtitle {
            margin: 10px 0 30px;
            color: var(--muted);
            font-size: 1.05rem;
            animation: fadeUp .8s var(--ease) .25s both;
        }

        .search {
            position: relative;
            max-width: 520px;
            margin: 0 auto;
            animation: fadeUp .8s var(--ease) .35s both;
        }

        .search i.fa-magnifying-glass {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        .search input {
            width: 100%;
            padding: 16px 64px 16px 52px;
            font: inherit;
            font-size: 1rem;
            color: var(--ink);
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 999px;
            box-shadow: var(--shadow-1);
            outline: none;
            transition: box-shadow .3s var(--ease), border-color .3s var(--ease);
        }

        .search input::placeholder {
            color: var(--muted);
            opacity: .8;
        }

        .search input:focus-visible {
            border-color: var(--accent-from);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-from) 18%, transparent), var(--shadow-2);
        }

        .search kbd {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            min-width: 26px;
            padding: 1px 8px;
            font: 700 .78rem var(--font);
            text-align: center;
            color: var(--muted);
            background: var(--milk);
            border: 1px solid var(--line);
            border-radius: 8px;
            pointer-events: none;
        }

        .count {
            margin: 18px 0 0;
            font-size: .9rem;
            color: var(--muted);
            animation: fadeUp .8s var(--ease) .45s both;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 12px 24px 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 18px;
        }

        [data-layout="list"] .grid {
            grid-template-columns: 1fr;
            max-width: 760px;
            margin: 0 auto;
            gap: 12px;
        }

        .card {
            --d: 0ms;
            position: relative;
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 22px;
            color: inherit;
            text-decoration: none;
            background: linear-gradient(160deg, var(--paper) 55%, color-mix(in srgb, var(--paper) 90%, var(--cream)));
            border: 1px solid var(--line);
            border-radius: var(--r-card);
            box-shadow: var(--shadow-1);
            opacity: 0;
            transform: translateY(18px);
            transition:
                opacity .6s var(--ease) var(--d),
                transform .6s var(--ease) var(--d),
                box-shadow .35s var(--ease),
                border-color .35s var(--ease);
        }

        .card.in {
            opacity: 1;
            transform: none;
        }

        .card.in.settled {
            transition-delay: 0ms;
        }

        .tile {
            position: relative;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            width: 58px;
            height: 58px;
            font-size: 1.45rem;
            color: var(--ink);
            background: var(--cream);
            border-radius: var(--r-tile);
            transition: background .35s var(--ease), color .35s var(--ease), transform .35s var(--ease);
        }

        .tile::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55);
            pointer-events: none;
        }

        .body {
            flex: 1 1 auto;
            min-width: 0;
        }

        .body h3 {
            margin: 0;
            font-size: 1.12rem;
            font-weight: 700;
            line-height: 1.3;
            color: var(--ink);
            text-wrap: pretty;
        }

        .body p {
            margin: 4px 0 0;
            font-size: .9rem;
            line-height: 1.5;
            color: var(--muted);
            text-wrap: pretty;
        }

        .index {
            position: absolute;
            top: 12px;
            right: 18px;
            font: 700 .72rem var(--font);
            letter-spacing: .08em;
            font-variant-numeric: tabular-nums;
            color: var(--muted);
            opacity: .55;
        }

        .arrow {
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            font-size: .8rem;
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 50%;
            transition: all .35s var(--ease);
        }

        .card:focus-visible {
            outline: 3px solid var(--accent-from);
            outline-offset: 3px;
        }

        @media (hover: hover) {
            .card.in:hover {
                transform: translateY(-6px);
                border-color: color-mix(in srgb, var(--accent-from) 40%, var(--line));
                box-shadow: var(--shadow-3);
                transition-delay: 0ms;
            }

            .card:hover .tile {
                color: var(--accent-fg);
                background: linear-gradient(145deg, var(--accent-from), var(--accent-to));
                transform: rotate(-6deg) scale(1.06);
            }

            .card:hover .arrow {
                color: var(--accent-fg);
                background: linear-gradient(145deg, var(--accent-from), var(--accent-to));
                border-color: transparent;
                transform: translateX(4px);
            }
        }

        .empty {
            grid-column: 1 / -1;
            padding: 56px 20px;
            text-align: center;
            color: var(--muted);
        }

        .empty i {
            display: block;
            margin-bottom: 12px;
            font-size: 1.8rem;
            opacity: .6;
        }

        footer {
            padding: 48px 20px 64px;
            text-align: center;
            font-size: .88rem;
            color: var(--muted);
        }

        .tweaks-toggle {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 20;
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            color: var(--muted);
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 50%;
            box-shadow: var(--shadow-2);
            cursor: pointer;
            opacity: .55;
            transition: opacity .3s, transform .3s var(--ease);
        }

        .tweaks-toggle:hover,
        .tweaks-toggle:focus-visible,
        .tweaks-toggle[aria-expanded="true"] {
            opacity: 1;
        }

        .tweaks-toggle:hover {
            transform: rotate(40deg);
        }

        .tweaks {
            position: fixed;
            right: 18px;
            bottom: 72px;
            z-index: 20;
            width: 250px;
            padding: 16px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow-3);
            animation: fadeUp .35s var(--ease) both;
        }

        .tweaks h2 {
            margin: 0 0 12px;
            font-size: .8rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .tweak-row+.tweak-row {
            margin-top: 12px;
        }

        .tweak-row label,
        .tweak-row .lbl {
            display: block;
            margin-bottom: 6px;
            font-size: .85rem;
            font-weight: 600;
        }

        .seg {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 1fr;
            padding: 3px;
            background: var(--milk);
            border: 1px solid var(--line);
            border-radius: 12px;
        }

        .seg button {
            padding: 6px 8px;
            font: 600 .85rem var(--font);
            color: var(--muted);
            background: transparent;
            border: 0;
            border-radius: 9px;
            cursor: pointer;
            transition: all .25s var(--ease);
        }

        .seg button[aria-pressed="true"] {
            color: var(--accent-fg);
            background: linear-gradient(145deg, var(--accent-from), var(--accent-to));
            box-shadow: var(--shadow-1);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes logoIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(.96);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        [data-motion="off"] *,
        [data-motion="off"] *::before,
        [data-motion="off"] *::after {
            animation: none !important;
            transition-duration: .01ms !important;
            transition-delay: 0ms !important;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition-duration: .01ms !important;
                transition-delay: 0ms !important;
            }

            .card {
                opacity: 1;
                transform: none;
            }
        }

        @media (max-width: 600px) {
            header {
                padding-top: 40px;
            }

            .container {
                padding: 8px 16px 16px;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .card {
                padding: 18px;
                gap: 14px;
            }

            .tile {
                width: 52px;
                height: 52px;
                font-size: 1.3rem;
            }

            .search kbd {
                display: none;
            }

            .search input {
                padding-right: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="ambient" aria-hidden="true"><span class="a"></span><span class="b"></span></div>
    <header>
        <div class="logo-plate">
            <img class="logo" src="https://patawee-erc.github.io/profile/logo_milkomilk.png" alt="milkomilk" width="240" height="240">
        </div>
        <h1>My App Portal</h1>
        <p class="subtitle">ศูนย์รวมลิงก์แอปพลิเคชันและเครื่องมือดิจิทัล</p>
        <div class="search" role="search">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input type="search" id="appSearch" placeholder="ค้นหาชื่อระบบ..." autocomplete="off" aria-label="ค้นหาชื่อระบบ">

        </div>
        <p class="count" id="count" aria-live="polite"></p>
    </header>
    <main class="container">
        <div class="grid" id="appGrid"></div>
    </main>
    <footer>
        <p>&copy; 2026 milkomilk</p>
    </footer>
    <button class="tweaks-toggle" id="tweaksToggle" aria-expanded="false" aria-controls="tweaksPanel" aria-label="Tweaks" title="Tweaks (T)">
        <i class="fa-solid fa-sliders"></i>
    </button>
    <aside class="tweaks" id="tweaksPanel" hidden>
        <h2>Tweaks</h2>
        <div class="tweak-row">
            <span class="lbl">Theme</span>
            <div class="seg" data-key="theme">
                <button type="button" data-value="milk">Milk</button>
                <button type="button" data-value="night">Night</button>
            </div>
        </div>
        <div class="tweak-row">
            <span class="lbl">Layout</span>
            <div class="seg" data-key="layout">
                <button type="button" data-value="grid">Grid</button>
                <button type="button" data-value="list">List</button>
            </div>
        </div>
        <div class="tweak-row">
            <span class="lbl">Motion</span>
            <div class="seg" data-key="motion">
                <button type="button" data-value="on">On</button>
                <button type="button" data-value="off">Off</button>
            </div>
        </div>
    </aside>

            { icon: 'fa-solid fa-guitar', title: 'Guitar Chord Player Studio', desc: 'simulation guitar chord player', href: 'https://patawee-erc.github.io/GuitarPlayer/' },
            { icon: 'fa-solid fa-hat-wizard', title: 'Split PDF', desc: 'PDF Splitter & Compressor with Progress', href: 'https://patawee-erc.github.io/pdfsplit/' },
            { icon: 'fa-solid fa-route', title: 'Gas Pipeline System', desc: 'ระบบแผนที่แนวท่อส่งก๊าซธรรมชาติ', href: 'https://patawee-erc.github.io/mappin/gaspipeline.html' }
        ];
        const grid = document.getElementById('appGrid');
        const input = document.getElementById('appSearch');
        const countEl = document.getElementById('count');
        
        grid.innerHTML = APPS.map((a, i) => `
            <a href="${a.href}" class="card" target="_blank" rel="noopener noreferrer"
               data-search="${(a.title + ' ' + a.desc).toLowerCase()}" style="--d:${Math.min(i * 45, 450)}ms">
                <span class="index" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span>
                <span class="tile"><i class="${a.icon}" aria-hidden="true"></i></span>
                <span class="body">
                    <h3>${a.title}</h3>
                    <p>${a.desc}</p>
                </span>
                <span class="arrow" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></span>
            </a>`).join('') +
            `<div class="empty" id="empty" hidden><i class="fa-regular fa-face-frown-open" aria-hidden="true"></i>ไม่พบระบบที่ค้นหา</div>`;
        const cards = [...grid.querySelectorAll('.card')];
        const empty = document.getElementById('empty');
        
        const io = new IntersectionObserver((entries) => {
            entries.forEach(e => {
                if (!e.isIntersecting) return;
                e.target.classList.add('in');
                setTimeout(() => e.target.classList.add('settled'), 1100);
                io.unobserve(e.target);
            });
        }, { rootMargin: '0px 0px -40px 0px', threshold: 0.05 });
        cards.forEach(c => io.observe(c));
        
        function filterApps() {
            const q = input.value.trim().toLowerCase();
            let shown = 0;
            cards.forEach(c => {
                const match = !q || c.dataset.search.includes(q);
                c.hidden = !match;
                if (match) {
                    shown++;
                    c.classList.add('in', 'settled');
                }
            });
            empty.hidden = shown !== 0;
            countEl.textContent = q ? `พบ ${shown} จาก ${cards.length} ระบบ` : `${cards.length} ระบบ`;
        }
        input.addEventListener('input', filterApps);
        filterApps();
        document.addEventListener('keydown', (e) => {
            const typing = /input|textarea|select/i.test(document.activeElement.tagName);
            if (e.key === '/' && !typing) { e.preventDefault(); input.focus(); }
            if ((e.key === 't' || e.key === 'T') && !typing && !e.metaKey && !e.ctrlKey) toggleTweaks();
            if (e.key === 'Escape') { if (input.value) { input.value = ''; filterApps(); } closeTweaks(); }
        });
        
        const root = document.documentElement;
        const panel = document.getElementById('tweaksPanel');
        const toggle = document.getElementById('tweaksToggle');
        const defaults = { theme: 'milk', layout: 'grid', motion: 'on' };
        let prefs = { ...defaults };
        try { prefs = { ...defaults, ...JSON.parse(localStorage.getItem('milkomilk-portal') || '{}') }; } catch (e) { }
        function applyPrefs() {
            root.dataset.theme = prefs.theme;
            root.dataset.layout = prefs.layout;
            root.dataset.motion = prefs.motion;
            document.querySelectorAll('.seg').forEach(seg => {
                seg.querySelectorAll('button').forEach(b =>
                    b.setAttribute('aria-pressed', String(b.dataset.value === prefs[seg.dataset.key])));
            });
        }
        document.querySelectorAll('.seg').forEach(seg => {
            seg.addEventListener('click', (e) => {
                const b = e.target.closest('button');
                if (!b) return;
                prefs[seg.dataset.key] = b.dataset.value;
                applyPrefs();
                try { localStorage.setItem('milkomilk-portal', JSON.stringify(prefs)); } catch (err) { }
            });
        });
        function openTweaks() { panel.hidden = false; toggle.setAttribute('aria-expanded', 'true'); }
        function closeTweaks() { panel.hidden = true; toggle.setAttribute('aria-expanded', 'false'); }
        function toggleTweaks() { panel.hidden ? openTweaks() : closeTweaks(); }
        toggle.addEventListener('click', toggleTweaks);
        applyPrefs();
    </script>
</body>

</html>
