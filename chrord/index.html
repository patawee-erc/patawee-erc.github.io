<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Guitar Chord Finder & Analyzer</title>
    
    <!-- Library สำหรับวาดรูปคอร์ด -->
    <script src="https://omnibrain.github.io/svguitar/js/svguitar.umd.js"></script>
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --bg: #f4f7f6;
            --border: #dfe6e9;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--primary);
        }

        .container { 
            max-width: 1300px; 
            margin: 0 auto; 
            text-align: center; 
            width: 100%;
        }

        .header { margin-bottom: 25px; }
        .header h1 { font-size: 2.5rem; color: var(--primary); margin-bottom: 10px; }
        .status { color: #666; font-size: 0.9rem; }

        /* ระบบ Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tab-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            background: #e2e8f0;
            color: #4a5568;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* TAB 1: ค้นหาทีละคอร์ด */
        .controls {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        select, textarea {
            border: 2px solid var(--border);
            border-radius: 10px;
            background: white;
            font-size: 16px;
            transition: all 0.3s;
        }

        select {
            padding: 12px 25px;
            cursor: pointer;
        }

        select:focus, textarea:focus { 
            border-color: var(--accent); 
            outline: none; 
        }

        /* TAB 2: วิเคราะห์จากเนื้อเพลง (แบ่งพื้นที่ซ้าย-ขวา) */
        .analyzer-layout {
            display: flex;
            gap: 30px;
            text-align: left;
            align-items: flex-start;
        }

        .analyzer-left {
            flex: 0 0 400px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            position: sticky;
            top: 20px;
        }

        .analyzer-right {
            flex: 1;
            min-width: 0;
        }

        textarea {
            width: 100%;
            height: 350px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            resize: vertical;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .btn-analyze {
            background: var(--accent);
            color: white;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-analyze:hover {
            background: #219653;
        }

        /* การ์ดแสดงผลคอร์ดแบบ Grid */
        .result-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            text-align: left;
            border-left: 5px solid var(--accent);
            padding-left: 10px;
            font-weight: bold;
        }

        .chord-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .chord-card {
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .chord-title { font-size: 1.6rem; font-weight: bold; margin-bottom: 5px; color: var(--accent); }
        .chord-pos { font-size: 0.9rem; color: #7f8c8d; margin-bottom: 10px; }
        
        .chart-container { 
            width: 100%; 
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chart-container svg {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }

        @media (max-width: 900px) {
            .analyzer-layout {
                flex-direction: column;
            }
            .analyzer-left {
                flex: 1 1 100%;
                width: 100%;
                position: static;
                margin-bottom: 20px;
            }
        }

        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-top: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🎸 Ultimate Chord Finder & Analyzer</h1>
            <div id="loading-status" class="status">กำลังโหลดฐานข้อมูลคอร์ด...</div>
            <div id="loader" class="loader"></div>
        </div>

        <!-- แท็บสลับการทำงาน -->
        <div class="tabs hidden" id="app-tabs">
            <button class="tab-btn active" onclick="switchTab('finder-tab', this)">🔍 ค้นหาทีละคอร์ด</button>
            <button class="tab-btn" onclick="switchTab('analyzer-tab', this)">📝 วิเคราะห์จากเนื้อเพลง</button>
        </div>

        <!-- TAB 1: ค้นหาทีละคอร์ด -->
        <div id="finder-tab" class="tab-content active">
            <div class="controls">
                <!-- ปรับแต่งข้อความแสดงผลตัวเลือก Flat ให้กลายเป็น Sharp -->
                <select id="root-note">
                    <option value="C">C</option>
                    <option value="C#">C#</option>
                    <option value="D">D</option>
                    <option value="Eb">D#</option> <!-- DB Key = Eb, แสดงผล = D# -->
                    <option value="E">E</option>
                    <option value="F">F</option>
                    <option value="F#">F#</option>
                    <option value="G">G</option>
                    <option value="Ab">G#</option> <!-- DB Key = Ab, แสดงผล = G# -->
                    <option value="A">A</option>
                    <option value="Bb">A#</option> <!-- DB Key = Bb, แสดงผล = A# -->
                    <option value="B">B</option>
                </select>

                <select id="chord-suffix">
                    <!-- จะถูกเติมอัตโนมัติจาก Database -->
                </select>
            </div>
            
            <div id="finder-result-header" class="result-title hidden">ผลลัพธ์การค้นหา</div>
            <div id="finder-display" class="chord-grid"></div>
        </div>

        <!-- TAB 2: วิเคราะห์จากเนื้อเพลง -->
        <div id="analyzer-tab" class="tab-content">
            <div class="analyzer-layout">
                <div class="analyzer-left">
                    <p style="margin-top: 0; font-weight: bold; color: var(--primary);">วางเนื้อเพลงที่มีคอร์ด:</p>
                    <textarea id="lyric-input" placeholder="วางเนื้อเพลงที่มีคอร์ดที่นี่... เช่น&#10;| Bm            |  Bm                      |&#10;เช้าลืมตามาก็มีเรื่องให้คิด...&#10;| G                       | Em                 | Bm |"></textarea>
                    <button class="btn-analyze" onclick="analyzeLyrics()">วิเคราะห์คอร์ดในเพลง</button>
                </div>

                <div class="analyzer-right">
                    <div id="analyzer-result-header" class="result-title hidden">คอร์ดที่พบในเพลงนี้</div>
                    <div id="analyzer-display" class="chord-grid"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let fullChordDb = null;
        let activeTabId = 'finder-tab';

        async function fetchChordDb() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/tombatossals/chords-db/master/lib/guitar.json');
                const data = await response.json();
                fullChordDb = data.chords;
                
                initApp();
            } catch (error) {
                document.getElementById('loading-status').innerText = 'ไม่สามารถโหลดข้อมูลได้ โปรดตรวจสอบการเชื่อมต่ออินเทอร์เน็ต';
                console.error(error);
            }
        }

        function initApp() {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('loading-status').innerText = 'ฐานข้อมูลพร้อมใช้งาน!';
            document.getElementById('app-tabs').classList.remove('hidden');

            const suffixes = new Set();
            Object.values(fullChordDb).forEach(chordVariations => {
                chordVariations.forEach(v => suffixes.add(v.suffix));
            });

            const suffixSelect = document.getElementById('chord-suffix');
            Array.from(suffixes).sort().forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.innerText = s === 'major' ? 'Major' : s;
                suffixSelect.appendChild(opt);
            });

            suffixSelect.value = 'major';
            
            document.getElementById('root-note').addEventListener('change', () => {
                if (activeTabId === 'finder-tab') renderSingleChord();
            });
            suffixSelect.addEventListener('change', () => {
                if (activeTabId === 'finder-tab') renderSingleChord();
            });

            renderSingleChord();
        }

        function switchTab(tabId, btnElement) {
            activeTabId = tabId;
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');

            document.getElementById('finder-display').innerHTML = '';
            document.getElementById('analyzer-display').innerHTML = '';
            document.getElementById('finder-result-header').classList.add('hidden');
            document.getElementById('analyzer-result-header').classList.add('hidden');

            if (tabId === 'finder-tab') {
                renderSingleChord();
            }
        }

        // แปลงโน้ต Flat (b) จากฐานข้อมูล ให้กลายเป็นโน้ต Sharp (#) สำหรับใช้แสดงผลบนหน้าจอ
        function toSharpDisplay(root) {
            const map = {
                'Eb': 'D#',
                'Ab': 'G#',
                'Bb': 'A#'
            };
            return map[root] || root;
        }

        function renderSingleChord() {
            const root = document.getElementById('root-note').value;
            const suffix = document.getElementById('chord-suffix').value;
            const display = document.getElementById('finder-display');
            display.innerHTML = '';
            
            const header = document.getElementById('finder-result-header');
            const displayRoot = toSharpDisplay(root);
            header.innerText = `รูปแบบคอร์ดทั้งหมดของ ${displayRoot}${suffix === 'major' ? '' : suffix}`;
            header.classList.remove('hidden');

            const chordData = fullChordDb[root].find(c => c.suffix === suffix);

            if (!chordData) {
                display.innerHTML = `<p>ไม่พบรูปแบบคอร์ด ${displayRoot} ${suffix}</p>`;
                return;
            }

            chordData.positions.forEach((pos, index) => {
                createChordCard(root, suffix, pos, index, display);
            });
        }

        function analyzeLyrics() {
            const text = document.getElementById('lyric-input').value;
            const display = document.getElementById('analyzer-display');
            const header = document.getElementById('analyzer-result-header');
            display.innerHTML = '';

            if (!text.trim()) {
                alert('กรุณากรอกเนื้อเพลงที่มีคอร์ดก่อนครับ');
                return;
            }

            const tokens = text.split(/[\s|,\-\[\]()\/]+/);
            const foundChords = new Map();

            tokens.forEach(token => {
                const parsed = parseChordToken(token);
                if (parsed) {
                    const key = `${parsed.root}-${parsed.suffix}`;
                    if (!foundChords.has(key)) {
                        foundChords.set(key, parsed);
                    }
                }
            });

            if (foundChords.size === 0) {
                header.innerText = `ไม่พบสัญลักษณ์คอร์ดในเนื้อเพลงนี้`;
                header.classList.remove('hidden');
                return;
            }

            header.innerText = `คอร์ดที่พบในเพลงนี้ (ทั้งหมด ${foundChords.size} คอร์ด)`;
            header.classList.remove('hidden');

            Array.from(foundChords.values()).forEach((chord, idx) => {
                const dbChords = fullChordDb[chord.root];
                if (dbChords) {
                    const matchedChord = dbChords.find(c => c.suffix === chord.suffix);
                    if (matchedChord && matchedChord.positions.length > 0) {
                        const simplePosition = matchedChord.positions[0];
                        createChordCard(chord.root, chord.suffix, simplePosition, idx, display);
                    }
                }
            });
        }

        function parseChordToken(token) {
            token = token.trim();
            if (!token) return null;

            const match = token.match(/^([A-G][#b]?)(.*)$/);
            if (!match) return null;

            let root = match[1];
            let rawSuffix = match[2];

            // ตารางปรับเปลี่ยนโน้ตขาเข้า (รวมถึงแปลงโน้ตชาร์ปอื่นๆ เช่น D#, G#, A# ให้เป็นโครงสร้างของ DB)
            const rootMap = {
                'Db': 'C#',
                'D#': 'Eb',
                'Gb': 'F#',
                'G#': 'Ab',
                'A#': 'Bb'
            };
            if (rootMap[root]) {
                root = rootMap[root];
            }

            let suffix = rawSuffix;
            if (suffix === '' || suffix.toLowerCase() === 'maj') {
                suffix = 'major';
            } else if (suffix === 'm' || suffix.toLowerCase() === 'min') {
                suffix = 'minor';
            }

            if (fullChordDb[root]) {
                const exists = fullChordDb[root].some(c => c.suffix === suffix);
                if (exists) {
                    return { root, suffix };
                }
            }

            return null;
        }

        function createChordCard(root, suffix, pos, index, targetContainer) {
            const safeRoot = root.replace('#', 'sharp');
            const cardId = `chord-art-${index}-${safeRoot}-${suffix}-${targetContainer.id}`;
            
            // ใช้ชื่อแสดงผลแบบชาร์ป (#) บนหัวข้อการ์ดคอร์ดเสมอ
            const displayRoot = toSharpDisplay(root);
            
            const card = document.createElement('div');
            card.className = 'chord-card';
            card.innerHTML = `
                <div class="chord-title">${displayRoot}${suffix === 'major' ? '' : (suffix === 'minor' ? 'm' : suffix)}</div>
                <div class="chord-pos">เฟรตเริ่มต้น: ${pos.baseFret}</div>
                <div id="${cardId}" class="chart-container"></div>
            `;
            targetContainer.appendChild(card);

            const chart = new svguitar.SVGuitarChord(`#${cardId}`);
            
            const fingers = [];
            pos.frets.forEach((fret, i) => {
                if (fret > 0) {
                    const stringNum = 6 - i;
                    const fingerNum = pos.fingers[i] || 0;
                    fingers.push([stringNum, fret, fingerNum > 0 ? fingerNum.toString() : '']);
                }
            });

            chart.configure({
                strings: 6,
                frets: 5,
                position: pos.baseFret,
                fixedDiagramPosition: true,
                fingerSize: 0.7,
                barreChordRadius: 0.2,
                title: ''
            })
            .chord({
                fingers: fingers,
                barres: pos.barres ? pos.barres.map(b => ({ fret: b, fromString: 6, toString: 1 })) : [],
                silent: pos.frets.map((f, i) => f === -1 ? 6 - i : null).filter(n => n),
                open: pos.frets.map((f, i) => f === 0 ? 6 - i : null).filter(n => n)
            })
            .draw();
        }

        fetchChordDb();
    </script>
</body>
</html>
